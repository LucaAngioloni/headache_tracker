services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headache_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-headache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-headache}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-headache} -d ${POSTGRES_DB:-headache_tracker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - ./data/node_modules:/app/node_modules
    depends_on:
      - django

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./data/static:/srv/static:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - django
      - frontend
