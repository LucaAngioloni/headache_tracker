services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headache_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-headache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-headache}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-headache} -d ${POSTGRES_DB:-headache_tracker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./data/static:/srv/static:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - django
    restart: unless-stopped
